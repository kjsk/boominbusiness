<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pcbGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2e7d32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1b5e20;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="socketGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#424242;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#212121;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chipsetGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1565c0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d47a1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Motherboard PCB -->
  <rect x="10" y="10" width="180" height="180" rx="8" fill="url(#pcbGradient)" stroke="#1b5e20" stroke-width="2"/>
  
  <!-- CPU Socket -->
  <rect x="30" y="30" width="50" height="50" rx="4" fill="url(#socketGradient)" stroke="#333" stroke-width="2"/>
  <rect x="35" y="35" width="40" height="40" rx="2" fill="#666" stroke="#444" stroke-width="1"/>
  <text x="55" y="58" text-anchor="middle" fill="#ccc" font-family="Arial, sans-serif" font-size="8" font-weight="bold">LGA1700</text>
  
  <!-- RAM Slots -->
  <rect x="100" y="25" width="8" height="60" rx="2" fill="#333" stroke="#555" stroke-width="1"/>
  <rect x="115" y="25" width="8" height="60" rx="2" fill="#333" stroke="#555" stroke-width="1"/>
  <rect x="130" y="25" width="8" height="60" rx="2" fill="#333" stroke="#555" stroke-width="1"/>
  <rect x="145" y="25" width="8" height="60" rx="2" fill="#333" stroke="#555" stroke-width="1"/>
  
  <!-- RAM Slot Notches -->
  <rect x="102" y="50" width="4" height="3" fill="#1b5e20"/>
  <rect x="117" y="50" width="4" height="3" fill="#1b5e20"/>
  <rect x="132" y="50" width="4" height="3" fill="#1b5e20"/>
  <rect x="147" y="50" width="4" height="3" fill="#1b5e20"/>
  
  <!-- PCIe Slots -->
  <rect x="20" y="100" width="120" height="8" rx="2" fill="#333" stroke="#555" stroke-width="1"/>
  <rect x="20" y="115" width="120" height="8" rx="2" fill="#333" stroke="#555" stroke-width="1"/>
  <rect x="20" y="130" width="60" height="8" rx="2" fill="#333" stroke="#555" stroke-width="1"/>
  
  <!-- PCIe Slot Connectors -->
  <g fill="#ffd700" stroke="#e6c200" stroke-width="0.2">
    <rect x="25" y="102" width="110" height="1"/>
    <rect x="25" y="105" width="110" height="1"/>
    <rect x="25" y="117" width="110" height="1"/>
    <rect x="25" y="120" width="110" height="1"/>
    <rect x="25" y="132" width="50" height="1"/>
    <rect x="25" y="135" width="50" height="1"/>
  </g>
  
  <!-- Chipset -->
  <rect x="100" y="100" width="25" height="25" rx="2" fill="url(#chipsetGradient)" stroke="#0d47a1" stroke-width="1"/>
  <text x="112.5" y="110" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="7" font-weight="bold">Intel</text>
  <text x="112.5" y="118" text-anchor="middle" fill="#ccc" font-family="Arial, sans-serif" font-size="6">Z790</text>
  
  <!-- BIOS Chip -->
  <rect x="160" y="40" width="15" height="10" rx="1" fill="#444" stroke="#666" stroke-width="0.5"/>
  <text x="167.5" y="47" text-anchor="middle" fill="#ccc" font-family="Arial, sans-serif" font-size="5">BIOS</text>
  
  <!-- CMOS Battery -->
  <circle cx="170" cy="70" r="8" fill="#c0c0c0" stroke="#999" stroke-width="1"/>
  <text x="170" y="74" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="6">CR2032</text>
  
  <!-- Power Connectors -->
  <rect x="160" y="100" width="25" height="15" rx="2" fill="#333" stroke="#555" stroke-width="1"/>
  <text x="172.5" y="110" text-anchor="middle" fill="#ccc" font-family="Arial, sans-serif" font-size="6">24-PIN</text>
  
  <rect x="15" y="15" width="15" height="10" rx="2" fill="#333" stroke="#555" stroke-width="1"/>
  <text x="22.5" y="22" text-anchor="middle" fill="#ccc" font-family="Arial, sans-serif" font-size="5">8-PIN</text>
  
  <!-- SATA Connectors -->
  <rect x="160" y="130" width="8" height="6" rx="1" fill="#ff5722" stroke="#d84315" stroke-width="0.5"/>
  <rect x="160" y="140" width="8" height="6" rx="1" fill="#ff5722" stroke="#d84315" stroke-width="0.5"/>
  <rect x="160" y="150" width="8" height="6" rx="1" fill="#ff5722" stroke="#d84315" stroke-width="0.5"/>
  <rect x="160" y="160" width="8" height="6" rx="1" fill="#ff5722" stroke="#d84315" stroke-width="0.5"/>
  
  <!-- I/O Shield Area -->
  <rect x="170" y="10" width="18" height="40" rx="2" fill="#666" stroke="#444" stroke-width="1"/>
  
  <!-- USB Ports -->
  <rect x="172" y="15" width="6" height="4" rx="1" fill="#333"/>
  <rect x="172" y="22" width="6" height="4" rx="1" fill="#333"/>
  <rect x="180" y="15" width="6" height="4" rx="1" fill="#1565c0"/>
  <rect x="180" y="22" width="6" height="4" rx="1" fill="#1565c0"/>
  
  <!-- Audio/Ethernet -->
  <rect x="172" y="30" width="8" height="6" rx="1" fill="#4caf50"/>
  <rect x="182" y="30" width="4" height="6" rx="1" fill="#ff9800"/>
  
  <!-- Capacitors -->
  <circle cx="90" cy="40" r="3" fill="#424242" stroke="#666" stroke-width="0.5"/>
  <circle cx="90" cy="50" r="3" fill="#424242" stroke="#666" stroke-width="0.5"/>
  <circle cx="90" cy="60" r="3" fill="#424242" stroke="#666" stroke-width="0.5"/>
  
  <circle cx="140" cy="140" r="3" fill="#424242" stroke="#666" stroke-width="0.5"/>
  <circle cx="150" cy="140" r="3" fill="#424242" stroke="#666" stroke-width="0.5"/>
  
  <!-- VRM Components -->
  <rect x="15" y="35" width="8" height="6" rx="1" fill="#666" stroke="#444" stroke-width="0.5"/>
  <rect x="15" y="45" width="8" height="6" rx="1" fill="#666" stroke="#444" stroke-width="0.5"/>
  <rect x="15" y="55" width="8" height="6" rx="1" fill="#666" stroke="#444" stroke-width="0.5"/>
  
  <!-- Traces -->
  <rect x="30" y="85" width="60" height="1" fill="#4fc3f7" opacity="0.7"/>
  <rect x="30" y="88" width="60" height="1" fill="#4fc3f7" opacity="0.7"/>
  <rect x="95" y="30" width="1" height="50" fill="#4fc3f7" opacity="0.7"/>
  <rect x="98" y="30" width="1" height="50" fill="#4fc3f7" opacity="0.7"/>
  
  <!-- Brand Label -->
  <text x="100" y="175" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">ASUS ROG</text>
  <text x="100" y="187" text-anchor="middle" fill="#ccc" font-family="Arial, sans-serif" font-size="8">STRIX Z790-E</text>
</svg>