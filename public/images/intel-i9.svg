<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cpuGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0071c5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003d82;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chipGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f0f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d0d0d0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- CPU Package -->
  <rect x="20" y="20" width="160" height="160" rx="8" fill="url(#cpuGradient)" stroke="#002a5c" stroke-width="2"/>
  
  <!-- CPU Die -->
  <rect x="60" y="60" width="80" height="80" rx="4" fill="url(#chipGradient)" stroke="#999" stroke-width="1"/>
  
  <!-- Intel Logo Area -->
  <rect x="70" y="70" width="60" height="20" rx="2" fill="#0071c5"/>
  <text x="100" y="84" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Intel</text>
  
  <!-- CPU Model -->
  <text x="100" y="105" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Core i9</text>
  <text x="100" y="120" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="8">13900K</text>
  
  <!-- CPU Pins/Contacts -->
  <g fill="#666">
    <!-- Top pins -->
    <rect x="30" y="15" width="2" height="8" rx="1"/>
