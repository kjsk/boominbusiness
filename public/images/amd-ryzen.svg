<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="amdGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ed1c24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b71c1c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amdChipGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- CPU Package -->
  <rect x="20" y="20" width="160" height="160" rx="8" fill="url(#amdGradient)" stroke="#8d1414" stroke-width="2"/>
  
  <!-- CPU Die -->
  <rect x="60" y="60" width="80" height="80" rx="4" fill="url(#amdChipGradient)" stroke="#999" stroke-width="1"/>
  
  <!-- AMD Logo Area -->
  <rect x="70" y="70" width="60" height="20" rx="2" fill="#ed1c24"/>
  <text x="100" y="84" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">AMD</text>
  
  <!-- CPU Model -->
  <text x="100" y="105" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Ryzen 9</text>
  <text x="100" y="120" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="8">7950X</text>
  
  <!-- CPU Pins/Contacts (PGA style) -->
  <g fill="#666">
    <!-- Pin grid pattern -->
    <circle cx="75" cy="50" r="1.5"/>
    <circle cx="85" cy="50" r="1.5"/>
    <circle cx="95" cy="50" r="1.5"/>
    <circle cx="105" cy="50" r="1.5"/>
    <circle cx="115" cy="50" r="1.5"/>
    <circle cx="125" cy="50" r="1.5"/>
    
    <circle cx="75" cy="150" r="1.5"/>
    <circle cx="85" cy="150" r="1.5"/>
    <circle cx="95" cy="150" r="1.5"/>
    <circle cx="105" cy="150" r="1.5"/>
    <circle cx="115" cy="150" r="1.5"/>
    <circle cx="125" cy="150" r="1.5"/>
    
    <circle cx="50" cy="75" r="1.5"/>
    <circle cx="50" cy="85" r="1.5"/>
    <circle cx="50" cy="95" r="1.5"/>
    <circle cx="50" cy="105" r="1.5"/>
    <circle cx="50" cy="115" r="1.5"/>
    <circle cx="50" cy="125" r="1.5"/>
    
    <circle cx="150" cy="75" r="1.5"/>
    <circle cx="150" cy="85" r="1.5"/>
    <circle cx="150" cy="95" r="1.5"/>
    <circle cx="150" cy="105" r="1.5"/>
    <circle cx="150" cy="115" r="1.5"/>
    <circle cx="150" cy="125" r="1.5"/>
  </g>
  
  <!-- Corner notch (AMD style) -->
  <polygon points="20,20 35,20 20,35" fill="#333"/>
  
  <!-- Zen 4 Architecture indicator -->
  <text x="100" y="195" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="8">Zen 4 Architecture</text>
</svg>