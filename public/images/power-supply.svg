<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="psuGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#424242;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#212121;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#666;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#333;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="labelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffb300;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- PSU Case -->
  <rect x="30" y="40" width="140" height="120" rx="6" fill="url(#psuGradient)" stroke="#333" stroke-width="2"/>
  
  <!-- Fan Grille -->
  <rect x="40" y="50" width="120" height="100" rx="4" fill="#1a1a1a" stroke="#444" stroke-width="1"/>
  
  <!-- Fan -->
  <circle cx="100" cy="100" r="40" fill="url(#fanGradient)" stroke="#222" stroke-width="2"/>
  <circle cx="100" cy="100" r="5" fill="#333"/>
  
  <!-- Fan Blades -->
  <path d="M 100 60 Q 125 75 120 100 Q 125 125 100 140 Q 75 125 80 100 Q 75 75 100 60" fill="#555" opacity="0.8"/>
  <path d="M 140 100 Q 125 75 100 80 Q 75 75 60 100 Q 75 125 100 120 Q 125 125 140 100" fill="#555" opacity="0.6"/>
  
  <!-- Fan Guard -->
  <circle cx="100" cy="100" r="40" fill="none" stroke="#666" stroke-width="1"/>
  <circle cx="100" cy="100" r="30" fill="none" stroke="#666" stroke-width="0.5"/>
  <circle cx="100" cy="100" r="20" fill="none" stroke="#666" stroke-width="0.5"/>
  
  <!-- Brand Label -->
  <rect x="60" y="65" width="80" height="15" rx="2" fill="url(#labelGradient)" stroke="#ffb300" stroke-width="1"/>
  <text x="100" y="75" text-anchor="middle" fill="#000" font-family="Arial, sans-serif" font-size="10" font-weight="bold">CORSAIR</text>
  
  <!-- Model -->
  <text x="100" y="125" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">RM850x</text>
  <text x="100" y="138" text-anchor="middle" fill="#ccc" font-family="Arial, sans-serif" font-size="9">850W 80+ Gold</text>
  
  <!-- Power Switch -->
  <rect x="150" y="45" width="12" height="8" rx="2" fill="#333" stroke="#555" stroke-width="1"/>
  <circle cx="156" cy="49" r="2" fill="#4caf50"/>
  <text x="156" y="42" text-anchor="middle" fill="#ccc" font-family="Arial, sans-serif" font-size="5">PWR</text>
  
  <!-- Modular Connectors -->
  <rect x="175" y="60" width="15" height="80" rx="2" fill="#1a1a1a" stroke="#444" stroke-width="1"/>
  
  <!-- Connector Ports -->
  <rect x="178" y="65" width="9" height="6" rx="1" fill="#333" stroke="#555" stroke-width="0.5"/>
  <rect x="178" y="75" width="9" height="6" rx="1" fill="#333" stroke="#555" stroke-width="0.5"/>
  <rect x="178" y="85" width="9" height="6" rx="1" fill="#333" stroke="#555" stroke-width="0.5"/>
  <rect x="178" y="95" width="9" height="6" rx="1" fill="#333" stroke="#555" stroke-width="0.5"/>
  <rect x="178" y="105" width="9" height="6" rx="1" fill="#333" stroke="#555" stroke-width="0.5"/>
  <rect x="178" y="115" width="9" height="6" rx="1" fill="#333" stroke="#555" stroke-width="0.5"/>
  <rect x="178" y="125" width="9" height="6" rx="1" fill="#333" stroke="#555" stroke-width="0.5"/>
  <rect x="178" y="135" width="9" height="6" rx="1" fill="#333" stroke="#555" stroke-width="0.5"/>
  
  <!-- Connector Labels -->
  <text x="182.5" y="69" text-anchor="middle" fill="#ccc" font-family="Arial, sans-serif" font-size="4">24P</text>
  <text x="182.5" y="79" text-anchor="middle" fill="#ccc" font-family="Arial, sans-serif" font-size="4">8P</text>
  <text x="182.5" y="89" text-anchor="middle" fill="#ccc" font-family="Arial, sans-serif" font-size="4">8P</text>
  <text x="182.5" y="99" text-anchor="middle" fill="#ccc" font-family="Arial, sans-serif" font-size="4">6P</text>
  <text x="182.5" y="109" text-anchor="middle" fill="#ccc" font-family="Arial, sans-serif" font-size="4">6P</text>
  <text x="182.5" y="119" text-anchor="middle" fill="#ccc" font-family="Arial, sans-serif" font-size="4">ST</text>
  <text x="182.5" y="129" text-anchor="middle" fill="#ccc" font-family="Arial, sans-serif" font-size="4">ST</text>
  <text x="182.5" y="139" text-anchor="middle" fill="#ccc" font-family="Arial, sans-serif" font-size="4">ST</text>
  
  <!-- AC Input -->
  <rect x="25" y="85" width="12" height="30" rx="2" fill="#1a1a1a" stroke="#444" stroke-width="1"/>
  <rect x="27" y="90" width="8" height="8" rx="1" fill="#333"/>
  <rect x="27" y="102" width="8" height="8" rx="1" fill="#333"/>
  
  <!-- Voltage Selector -->
  <rect x="27" y="70" width="8" height="10" rx="1" fill="#ff5722" stroke="#d84315" stroke-width="0.5"/>
  <text x="31" y="77" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="5">115V</text>
  
  <!-- Efficiency Badge -->
  <circle cx="60" cy="120" r="12" fill="#ffd700" stroke="#ffb300" stroke-width="1"/>
  <text x="60" y="117" text-anchor="middle" fill="#000" font-family="Arial, sans-serif" font-size="6" font-weight="bold">80+</text>
  <text x="60" y="125" text-anchor="middle" fill="#000" font-family="Arial, sans-serif" font-size="5">GOLD</text>
  
  <!-- Mounting Screws -->
  <circle cx="40" cy="50" r="2" fill="#666" stroke="#444" stroke-width="0.5"/>
  <circle cx="160" cy="50" r="2" fill="#666" stroke="#444" stroke-width="0.5"/>
  <circle cx="40" cy="150" r="2" fill="#666" stroke="#444" stroke-width="0.5"/>
  <circle cx="160" cy="150" r="2" fill="#666" stroke="#444" stroke-width="0.5"/>
  
  <!-- Ventilation Grilles -->
  <rect x="45" y="165" width="110" height="3" rx="1" fill="#333" opacity="0.7"/>
  <rect x="50" y="170" width="100" height="2" rx="1" fill="#333" opacity="0.5"/>
  <rect x="55" y="175" width="90" height="2" rx="1" fill="#333" opacity="0.5"/>
  
  <!-- Specifications -->
  <text x="100" y="190" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="8">Fully Modular PSU</text>
</svg>