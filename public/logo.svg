<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 40" width="70" height="40">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5e7eb;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="3" dy="3" stdDeviation="3" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
    <filter id="innerShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1"/>
      <feOffset dx="1" dy="1" result="offset"/>
      <feFlood flood-color="rgba(255,255,255,0.3)"/>
      <feComposite in2="offset" operator="in"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Enhanced background with rounded corners -->
  <rect x="5" y="5" width="60" height="30" rx="18" ry="18" fill="url(#logoGradient)" filter="url(#shadow)"/>
  
  <!-- Inner highlight for depth -->
  <rect x="7" y="7" width="56" height="26" rx="16" ry="16" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  
  <!-- BB Text with enhanced styling -->
  <text x="35" y="28" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="900" text-anchor="middle" fill="url(#textGradient)" filter="url(#innerShadow)" letter-spacing="-1px">BB</text>
</svg>